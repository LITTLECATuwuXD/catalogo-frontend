<!-- src/app/movie-create/movie-create.html -->
<div class="container mt-5">
  <div class="card text-white shadow">
    <div class="card-header">
      <h2>Agregar Nueva Película</h2>
    </div>
    <div class="card-body">

      @if (errorMessage) {
        <div class="alert alert-danger">{{ errorMessage }}</div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="title" class="form-label">Título</label>
          <input type="text" class="form-control" id="title" [(ngModel)]="newMovie.title" name="title" required>
        </div>

        <div class="mb-3">
          <label for="synopsis" class="form-label">Sinopsis</label>
          <textarea class="form-control" id="synopsis" rows="3" [(ngModel)]="newMovie.synopsis" name="synopsis" required></textarea>
        </div>

        <div class="mb-3">
          <label for="year" class="form-label">Año</label>
          <input type="number" class="form-control" id="year" [(ngModel)]="newMovie.year" name="year" required>
        </div>

        <div class="mb-3">
          <label for="cover" class="form-label">Portada (URL o archivo)</label>
          <input type="text" class="form-control mb-2" id="coverUrl"
         [(ngModel)]="newMovie.cover" name="coverUrl"
         placeholder="https://... o deja vacío si subirás archivo">
          <input type="file" class="form-control" id="coverFile"
         (change)="onFileSelected($event)" accept="image/*">
        </div>

        <button type="submit" class="btn btn-success">Guardar Película</button>
        <a routerLink="/movies" class="btn btn-secondary ms-2">Cancelar</a>
      </form>
    </div>
  </div>
</div>
