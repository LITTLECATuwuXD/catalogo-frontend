<div class="container mt-5">
  @if (loading) {
    <p class="text-center text-white">Cargando detalle de la película...</p>
  } @else if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  } @else if (movie) {
    <div class="card text-white shadow">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h2 class="mb-0">{{ movie.title }}</h2>
        <span class="badge bg-secondary">{{ movie.year }}</span>
      </div>
      <div class="card-body text-center">
        <!-- Renderizado de portada: URL o storage -->
        <img
          [src]="getCoverUrl(movie.cover)"
          alt="Portada de {{ movie.title }}"
          class="img-fluid rounded mb-3"
          style="max-height: 350px; object-fit: cover;"
          onerror="this.src='https://via.placeholder.com/300x450?text=Sin+portada'"
        />
        <p class="card-text"><strong>Sinopsis:</strong> {{ movie.synopsis }}</p>
      </div>
      <div class="card-footer d-flex justify-content-center gap-2">
        <a [routerLink]="['/movie/edit', movie.id]" class="btn btn-warning">Editar</a>
        <button class="btn btn-danger" (click)="confirmDelete()">Eliminar</button>
        <a routerLink="/movies" class="btn btn-secondary">Regresar al catálogo</a>
      </div>
    </div>
  } @else {
    <p class="text-center text-white">No se encontró la película.</p>
  }
</div>
