@if (loading) {
  <p>Cargando detalle de la película...</p>
} @else if (error) {
  <p>{{ error }}</p>
} @else if (movie) {
  <div>
    <h2>{{ movie.title }}</h2>
    <p><strong>Año:</strong> {{ movie.year }}</p>
    <p><strong>Sinopsis:</strong> {{ movie.synopsis }}</p>
    <p><strong>Portada:</strong> {{ movie.cover }}</p>
    <p><a routerLink="/movies">← Volver al catálogo</a></p>
  </div>
} @else {
  <p>No se encontró la película.</p>
}
